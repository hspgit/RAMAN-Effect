# Base-size trial rerun with masked GroupNorm (the stem fix of 2026-10-03).
# The original base trial (20261003-052918_base_trial) ran before that fix, so
# small and base were never compared on the current stem. Settings are the
# trial settings unchanged; only the tag differs, so the run folder reads
# <stamp>_base_trial_mgn next to 20261003-111809_small_trial_mgn.
tag: trial_mgn
preset: base
corpus_dir: foundation/data/corpus_v1
run_root: foundation/runs/pretrain
seed: 0
device: cuda
batch_size: 512
lr: 3.0e-4
weight_decay: 0.05
betas: [0.9, 0.95]
warmup_epochs: 10
max_epochs: 50
grad_clip: 1.0
mask_ratio: 0.5
mask_block: [2, 6]
deriv_weight: 0.5
corruption: pretrain
probe_every: 10
patience: 3
amp: true
n_recon: 16
