# Main pretraining of the base preset (14.6M parameters) with masked GroupNorm.
# Identical to pretrain_main.yaml except for the preset, so the only change
# from model A (20261003-123546_small_main) is size. Run it after the
# base_trial_mgn trial (see Amos/WEEKLY_REPORT_2026-10-16.md for the gate).
tag: main
preset: base
corpus_dir: foundation/data/corpus_v1
run_root: foundation/runs/pretrain
seed: 0
device: cuda
batch_size: 512
lr: 3.0e-4
weight_decay: 0.05
betas: [0.9, 0.95]
warmup_epochs: 10
max_epochs: 200
grad_clip: 1.0
mask_ratio: 0.5
mask_block: [2, 6]
deriv_weight: 0.5
corruption: pretrain
probe_every: 10
patience: 3
amp: true
n_recon: 16
